name: Pipeline de Actualizacion Diaria de Datos HIS

on:
  push:
    paths:
      - 'data/his_raw.csv'   # Se activa en el momento que subas el archivo plano
  workflow_dispatch:          # Te añade un botón manual en la pestaña "Actions" por si quieres forzar la actualización

jobs:
  build-and-process:
    runs-on: ubuntu-latest
    steps:
    - name: Descargar el estado actual del repositorio
      uses: actions/checkout@v3

    - name: Configurar entorno de Python de forma virtual
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Instalar la biblioteca Pandas
      run: |
        python -m pip install --upgrade pip
        pip install pandas

    - name: Ejecutar script de análisis de datos
      run: python scripts/procesar_his.py

    - name: Realizar Auto-Commit y empujar la base de datos actualizada
      run: |
        git config --global user.name "GitHub Actions Bot"
        git config --global user.email "actions@github.com"
        git add data/data_jornada.csv
        git diff --quiet && git diff --staged --quiet || (git commit -m "Automatización: Base de datos consolidada por el sistema" && git push)
